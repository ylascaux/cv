name: Infrastructure deployment

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/deploy-infrastructure.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/deploy-infrastructure.yml'

permissions:
  contents: read

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

env:
  TMPDIR: /tmp
  OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
  OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
  OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OVH_STATE_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OVH_STATE_S3_SECRET_KEY }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  plan:
    name: Plan production infrastructure
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            OVH_APPLICATION_KEY
            OVH_APPLICATION_SECRET
            OVH_CONSUMER_KEY
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing GitHub Actions variable or secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Generate production stack
        run: nix develop --command sh -c 'cd deploy/live/production && terragrunt stack generate'

      - name: Plan production infrastructure
        working-directory: deploy/live/production/.terragrunt-stack
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## OpenTofu production plan'
            echo
            echo '```terraform'
          } >> "$GITHUB_STEP_SUMMARY"

          nix develop "$GITHUB_WORKSPACE" --command \
            terragrunt --no-color run --all -- plan -input=false -no-color 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply production infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production-infrastructure
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            OVH_APPLICATION_KEY
            OVH_APPLICATION_SECRET
            OVH_CONSUMER_KEY
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing GitHub Actions variable or secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Generate production stack
        run: nix develop --command sh -c 'cd deploy/live/production && terragrunt stack generate'

      - name: Apply production infrastructure
        working-directory: deploy/live/production/.terragrunt-stack
        run: nix develop "$GITHUB_WORKSPACE" --command terragrunt --non-interactive run --all -- apply -auto-approve -input=false
