name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and static artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run quality checks
        run: npm run quality

      - name: Generate PDF resumes
        run: npm run pdf:generate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload production deployment configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-deployment-config-${{ github.sha }}
          path: deploy/live/production/env.hcl
          if-no-files-found: error
          retention-days: 14

      - name: Upload preview deployment configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-preview-deployment-config-${{ github.sha }}
          path: deploy/live/preview/env.hcl
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    name: OpenTofu and Terragrunt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20

      - name: Check GitHub Actions are pinned by SHA
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r action; do
            ref="${action##*@}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "GitHub Action is not pinned to a full commit SHA: $action" >&2
              failed=1
            fi
          done < <(
            grep -RhE '^[[:space:]]*uses:[[:space:]]*[^[:space:]#]+' .github/workflows \
              | sed -E 's/^[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/'
          )
          exit "$failed"

      - name: Check pinned tool versions
        run: |
          nix develop --command tofu version
          nix develop --command terragrunt --version

      - name: Check GitHub Actions workflows
        run: nix develop --command actionlint

      - name: Check OpenTofu and Terragrunt formatting
        run: |
          nix develop --command tofu fmt -check -recursive deploy/terraform
          nix develop --command terragrunt hcl fmt --check

      - name: Validate OpenTofu modules
        run: |
          nix develop --command sh -c 'cd deploy/terraform/ovh-object-storage && tofu init -backend=false && tofu validate'
          nix develop --command sh -c 'cd deploy/terraform/cloudflare-edge && tofu init -backend=false && tofu validate'

      - name: Generate and validate Terragrunt stacks
        run: |
          nix develop --command sh -c 'cd deploy/live/production && terragrunt stack generate'
          nix develop --command sh -c 'cd deploy/live/production/.terragrunt-stack && terragrunt hcl validate'
          nix develop --command sh -c 'cd deploy/live/preview && terragrunt stack generate'
          nix develop --command sh -c 'cd deploy/live/preview/.terragrunt-stack && terragrunt hcl validate'

      # Plans require OVHcloud and Cloudflare credentials and are reviewed
      # separately. This workflow never applies infrastructure.
