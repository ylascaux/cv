services:
  cv:
    build:
      context: .
    ports:
      - '4321:80'
    restart: unless-stopped

  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    environment:
      ASTRO_TELEMETRY_DISABLED: '1'
    ports:
      - '4322:4321'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4321/').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
