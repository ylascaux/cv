      - Conception de prototypes autour de gateways LLM, MCP et agents IA pour assister l’analyse, la génération et la validation de changements d’infrastructure.
      - Expérimentation de services Azure OpenAI / AWS Bedrock, avec prise en compte de l’observabilité, de la qualité et des coûts associés.
      - Documentation des architectures, partage de connaissances et accompagnement des équipes dans l’adoption de nouveaux outils et standards.
      - Conception de Golden Paths et de capabilities Platform Engineering afin de standardiser les usages et d’améliorer l’autonomie des équipes de développement.

